<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For You ❤️</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    font-family: "Segoe UI", Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;

    background:
        radial-gradient(circle at top, #ff9a9e 0%, transparent 35%),
        linear-gradient(135deg, #1a001f, #4b003f, #17001c);

    color: white;
}

/* Main card */
.card {
    width: 92%;
    max-width: 470px;
    padding: 30px 24px;
    text-align: center;

    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 30px;

    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    box-shadow:
        0 0 25px rgba(255, 80, 150, 0.35),
        0 0 70px rgba(255, 50, 150, 0.18);

    animation: appear 1.2s ease;
    position: relative;
    z-index: 5;
}

/* Top heart */
.big-heart {
    font-size: 48px;
    animation: heartbeat 1.5s infinite;
    margin-bottom: 5px;
}

h1 {
    font-size: 32px;
    margin-bottom: 8px;
    background: linear-gradient(90deg, #fff, #ffb6d9, #fff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.subtitle {
    font-size: 15px;
    opacity: 0.9;
    margin-bottom: 20px;
}

/* Photo */
.photo-frame {
    padding: 7px;
    border-radius: 23px;

    background: linear-gradient(
        135deg,
        #ff4f9a,
        #ffffff,
        #ff4f9a,
        #ff9dcc
    );

    box-shadow:
        0 0 20px rgba(255, 70, 150, 0.7),
        0 0 45px rgba(255, 70, 150, 0.3);

    animation: glow 2.5s infinite alternate;
}

.photo-frame img {
    width: 100%;
    height: 390px;
    object-fit: cover;
    display: block;
    border-radius: 17px;
}

/* Romantic lines */
.message {
    margin-top: 22px;
    line-height: 1.7;
}

.line1 {
    font-size: 21px;
    font-weight: 600;
}

.line2 {
    font-size: 15px;
    opacity: 0.9;
    margin-top: 8px;
}

.line3 {
    margin-top: 14px;
    font-size: 18px;
}

/* Bottom */
.footer {
    margin-top: 20px;
    font-size: 13px;
    opacity: 0.75;
}

/* Floating hearts */
.heart {
    position: fixed;
    bottom: -50px;
    font-size: 24px;
    pointer-events: none;
    animation: floatHeart linear infinite;
    z-index: 1;
}

.heart:nth-child(1) {
    left: 5%;
    animation-duration: 8s;
    animation-delay: 1s;
}

.heart:nth-child(2) {
    left: 18%;
    animation-duration: 10s;
    animation-delay: 3s;
}

.heart:nth-child(3) {
    left: 32%;
    animation-duration: 7s;
    animation-delay: 0s;
}

.heart:nth-child(4) {
    left: 50%;
    animation-duration: 11s;
    animation-delay: 2s;
}

.heart:nth-child(5) {
    left: 67%;
    animation-duration: 8s;
    animation-delay: 4s;
}

.heart:nth-child(6) {
    left: 82%;
    animation-duration: 10s;
    animation-delay: 1s;
}

.heart:nth-child(7) {
    left: 93%;
    animation-duration: 7s;
    animation-delay: 3s;
}

/* Sparkles */
.sparkle {
    position: fixed;
    color: white;
    animation: sparkle 2s infinite;
    z-index: 2;
}

/* Animations */
@keyframes appear {
    from {
        opacity: 0;
        transform: scale(0.8) translateY(30px);
    }

    to {
        opacity: 1;
        transform: scale(1) translateY(0);
    }
}

@keyframes heartbeat {
    0%, 100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.2);
    }
}

@keyframes glow {
    from {
        box-shadow:
            0 0 15px rgba(255, 70, 150, 0.5),
            0 0 30px rgba(255, 70, 150, 0.2);
    }

    to {
        box-shadow:
            0 0 30px rgba(255, 70, 150, 0.9),
            0 0 65px rgba(255, 70, 150, 0.45);
    }
}

@keyframes floatHeart {
    0% {
        transform: translateY(0) scale(0.7);
        opacity: 0;
    }

    10% {
        opacity: 0.8;
    }

    50% {
        transform: translateY(-50vh) scale(1.1);
    }

    100% {
        transform: translateY(-110vh) scale(0.8);
        opacity: 0;
    }
}

@keyframes sparkle {
    0%, 100% {
        opacity: 0;
        transform: scale(0.5);
    }

    50% {
        opacity: 1;
        transform: scale(1.3);
    }
}

/* Mobile */
@media (max-width: 500px) {

    .card {
        padding: 24px 18px;
    }

    h1 {
        font-size: 27px;
    }

    .photo-frame img {
        height: 350px;
    }

    .line1 {
        font-size: 18px;
    }
}
</style>
</head>

<body>

<!-- Floating hearts -->
<div class="heart">❤️</div>
<div class="heart">💗</div>
<div class="heart">💕</div>
<div class="heart">💖</div>
<div class="heart">💘</div>
<div class="heart">💞</div>
<div class="heart">❤️</div>

<!-- Sparkles -->
<div class="sparkle" style="top:15%;left:12%;">✦</div>
<div class="sparkle" style="top:25%;right:15%;">✧</div>
<div class="sparkle" style="top:70%;left:8%;">✦</div>
<div class="sparkle" style="top:75%;right:10%;">✧</div>

<!-- Main -->
<div class="card">

    <div class="big-heart">❤️</div>

    <h1>For Someone Special</h1>

    <div class="subtitle">
        A little place made just for you ✨
    </div>

    <div class="photo-frame">

        <!-- Keep photo.jpg if your uploaded photo is named photo.jpg -->
        <img src="photo.jpg" alt="My Beautiful Memory">

    </div>

    <div class="message">

        <div class="line1">
            “Some people make ordinary moments feel magical.” ❤️
        </div>

        <div class="line2">
            And somehow, you are one of those people. ✨
        </div>

        <div class="line3">
            ♡ You are special ♡
        </div>

    </div>

    <div class="footer">
        Made with ❤️ just for you
    </div>

</div>

</body>
</html>
