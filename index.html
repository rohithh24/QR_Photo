<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For Someone Special ❤️</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px 15px;
            font-family: Arial, sans-serif;
            background:
                radial-gradient(circle at top, #ff6b9a 0%, #8e2de2 45%, #1a1035 100%);
            overflow-x: hidden;
            color: white;
        }

        /* Floating hearts */
        .heart {
            position: fixed;
            bottom: -40px;
            font-size: 22px;
            animation: float 7s linear infinite;
            opacity: 0.7;
            pointer-events: none;
        }

        .heart:nth-child(1) {
            left: 8%;
            animation-delay: 0s;
        }

        .heart:nth-child(2) {
            left: 25%;
            animation-delay: 2s;
        }

        .heart:nth-child(3) {
            left: 50%;
            animation-delay: 4s;
        }

        .heart:nth-child(4) {
            left: 72%;
            animation-delay: 1s;
        }

        .heart:nth-child(5) {
            left: 90%;
            animation-delay: 3s;
        }

        @keyframes float {
            0% {
                transform: translateY(0) scale(1);
                opacity: 0;
            }

            20% {
                opacity: 0.8;
            }

            100% {
                transform: translateY(-110vh) scale(1.5);
                opacity: 0;
            }
        }

        .container {
            width: 100%;
            max-width: 520px;
            position: relative;
            z-index: 2;
        }

        .card {
            width: 100%;
            padding: 25px 20px 30px;
            border-radius: 30px;
            text-align: center;

            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.35);

            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.45),
                0 0 35px rgba(255, 80, 150, 0.35);
        }

        .top-heart {
            font-size: 48px;
            margin-bottom: 5px;
            animation: beat 1.4s infinite;
        }

        @keyframes beat {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.18);
            }
        }

        h1 {
            margin: 5px 0 8px;
            font-size: 30px;
            letter-spacing: 1px;
            text-shadow: 0 3px 15px rgba(0, 0, 0, 0.4);
        }

        .subtitle {
            margin: 0 0 22px;
            font-size: 15px;
            opacity: 0.9;
        }

        /* PHOTO AREA */
        .photo-frame {
            width: 100%;
            padding: 8px;
            border-radius: 24px;

            background: linear-gradient(
                135deg,
                #ff4f8b,
                #ffd1df,
                #b34cff,
                #ff4f8b
            );

            box-shadow:
                0 0 25px rgba(255, 70, 150, 0.55);
        }

        .photo-frame img {
            width: 100%;
            height: auto;
            max-height: 70vh;

            display: block;
            margin: 0 auto;

            border-radius: 18px;

            /* IMPORTANT: shows the complete photo */
            object-fit: contain;
            object-position: center center;

            background: #111;
        }

        .quote {
            margin: 24px 10px 10px;
            font-size: 18px;
            line-height: 1.6;
            font-style: italic;
            font-weight: 500;
        }

        .line {
            width: 75%;
            height: 1px;
            margin: 18px auto;
            background: rgba(255, 255, 255, 0.5);
        }

        .message {
            font-size: 16px;
            line-height: 1.7;
            margin: 0 10px;
        }

        .love {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }

        .small-heart {
            font-size: 24px;
            margin: 0 4px;
        }

        .footer {
            margin-top: 18px;
            font-size: 12px;
            opacity: 0.7;
        }

        @media (max-width: 480px) {
            body {
                padding: 15px 10px;
            }

            .card {
                padding: 20px 14px 25px;
                border-radius: 25px;
            }

            h1 {
                font-size: 25px;
            }

            .quote {
                font-size: 16px;
            }

            .message {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <!-- Floating hearts -->
    <div class="heart">❤️</div>
    <div class="heart">💗</div>
    <div class="heart">💕</div>
    <div class="heart">💖</div>
    <div class="heart">❤️</div>

    <div class="container">

        <div class="card">

            <div class="top-heart">❤️</div>

            <h1>For Someone Special</h1>

            <p class="subtitle">
                A little place made just for you ✨
            </p>

            <!-- YOUR PHOTO -->
            <div class="photo-frame">
                <img src="Photo.jpg" alt="My Special Photo">
            </div>

            <p class="quote">
                “Some people make ordinary moments feel magical.” ❤️
            </p>

            <div class="line"></div>

            <p class="message">
                You are one of those people who make everything
                feel a little more beautiful. ✨
            </p>

            <div class="love">
                <span class="small-heart">💗</span>
                You are special
                <span class="small-heart">💗</span>
            </div>

            <div class="footer">
                Made with ❤️ just for you
            </div>

        </div>

    </div>

</body>
</html>
