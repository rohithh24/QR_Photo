<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Photo</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #111827, #312e81);
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 500px;
            background: white;
            padding: 15px;
            border-radius: 22px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
            text-align: center;
        }

        h2 {
            margin: 10px 0 15px;
        }

        img {
            width: 100%;
            display: block;
            border-radius: 15px;
        }
    </style>
</head>

<body>

    <div class="card">

        <h2>📸 My Photo</h2>

        <img src="photo.jpg" alt="My Photo">

    </div>

</body>
</html>
